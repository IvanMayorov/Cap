name: Deploy Cap to Beget

on:
  push:
    branches: [main]
    paths:
      - docker-compose.r2.yml
      - .github/workflows/deploy-beget.yml
  workflow_dispatch:
    inputs:
      migrate_to_beget:
        description: Migrate existing R2 objects and switch Cap to Beget S3
        required: true
        type: boolean
        default: false

concurrency:
  group: cap-beget-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, cap-beget]
    timeout-minutes: 20
    steps:
      - name: Deploy Cap with R2
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
          BEGET_S3_ACCESS_KEY_ID: ${{ secrets.BEGET_S3_ACCESS_KEY_ID }}
          BEGET_S3_SECRET_ACCESS_KEY: ${{ secrets.BEGET_S3_SECRET_ACCESS_KEY }}
          MIGRATE_TO_BEGET: ${{ inputs.migrate_to_beget }}
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$R2_ACCESS_KEY_ID"
          test -n "$R2_SECRET_ACCESS_KEY"
          test -n "$R2_S3_ENDPOINT"
          R2_ACCESS_KEY_ID_B64=$(printf '%s' "$R2_ACCESS_KEY_ID" | base64 | tr -d '\n')
          R2_SECRET_ACCESS_KEY_B64=$(printf '%s' "$R2_SECRET_ACCESS_KEY" | base64 | tr -d '\n')
          R2_S3_ENDPOINT_B64=$(printf '%s' "$R2_S3_ENDPOINT" | base64 | tr -d '\n')
          BEGET_S3_ACCESS_KEY_ID_B64=$(printf '%s' "$BEGET_S3_ACCESS_KEY_ID" | base64 | tr -d '\n')
          BEGET_S3_SECRET_ACCESS_KEY_B64=$(printf '%s' "$BEGET_S3_SECRET_ACCESS_KEY" | base64 | tr -d '\n')
          ASSEMBLY_API_KEY_B64=$(printf '%s' "$ASSEMBLY_API_KEY" | base64 | tr -d '\n')
          AI_PROVIDER_B64=$(printf '%s' "$AI_PROVIDER" | base64 | tr -d '\n')
          AI_MODEL_B64=$(printf '%s' "$AI_MODEL" | base64 | tr -d '\n')
          AI_BASE_URL_B64=$(printf '%s' "$AI_BASE_URL" | base64 | tr -d '\n')
          AI_API_KEY_B64=$(printf '%s' "$AI_API_KEY" | base64 | tr -d '\n')
          GROQ_API_KEY_B64=$(printf '%s' "$GROQ_API_KEY" | base64 | tr -d '\n')
          OPENAI_API_KEY_B64=$(printf '%s' "$OPENAI_API_KEY" | base64 | tr -d '\n')
          ANTHROPIC_API_KEY_B64=$(printf '%s' "$ANTHROPIC_API_KEY" | base64 | tr -d '\n')
          REPOSITORY_URL="$REPOSITORY_URL" \
          R2_ACCESS_KEY_ID_B64="$R2_ACCESS_KEY_ID_B64" \
          R2_SECRET_ACCESS_KEY_B64="$R2_SECRET_ACCESS_KEY_B64" \
          R2_S3_ENDPOINT_B64="$R2_S3_ENDPOINT_B64" \
          BEGET_S3_ACCESS_KEY_ID_B64="$BEGET_S3_ACCESS_KEY_ID_B64" \
          BEGET_S3_SECRET_ACCESS_KEY_B64="$BEGET_S3_SECRET_ACCESS_KEY_B64" \
          MIGRATE_TO_BEGET="$MIGRATE_TO_BEGET" \
          ASSEMBLY_API_KEY_B64="$ASSEMBLY_API_KEY_B64" \
          AI_PROVIDER_B64="$AI_PROVIDER_B64" \
          AI_MODEL_B64="$AI_MODEL_B64" \
          AI_BASE_URL_B64="$AI_BASE_URL_B64" \
          AI_API_KEY_B64="$AI_API_KEY_B64" \
          GROQ_API_KEY_B64="$GROQ_API_KEY_B64" \
          OPENAI_API_KEY_B64="$OPENAI_API_KEY_B64" \
          ANTHROPIC_API_KEY_B64="$ANTHROPIC_API_KEY_B64" bash -s <<'REMOTE'
          set -euo pipefail

          R2_ACCESS_KEY_ID=$(printf '%s' "$R2_ACCESS_KEY_ID_B64" | base64 -d)
          R2_SECRET_ACCESS_KEY=$(printf '%s' "$R2_SECRET_ACCESS_KEY_B64" | base64 -d)
          R2_S3_ENDPOINT=$(printf '%s' "$R2_S3_ENDPOINT_B64" | base64 -d)
          BEGET_S3_ACCESS_KEY_ID=$(printf '%s' "$BEGET_S3_ACCESS_KEY_ID_B64" | base64 -d)
          BEGET_S3_SECRET_ACCESS_KEY=$(printf '%s' "$BEGET_S3_SECRET_ACCESS_KEY_B64" | base64 -d)
          ASSEMBLY_API_KEY=$(printf '%s' "$ASSEMBLY_API_KEY_B64" | base64 -d)
          AI_PROVIDER=$(printf '%s' "$AI_PROVIDER_B64" | base64 -d)
          AI_MODEL=$(printf '%s' "$AI_MODEL_B64" | base64 -d)
          AI_BASE_URL=$(printf '%s' "$AI_BASE_URL_B64" | base64 -d)
          AI_API_KEY=$(printf '%s' "$AI_API_KEY_B64" | base64 -d)
          GROQ_API_KEY=$(printf '%s' "$GROQ_API_KEY_B64" | base64 -d)
          OPENAI_API_KEY=$(printf '%s' "$OPENAI_API_KEY_B64" | base64 -d)
          ANTHROPIC_API_KEY=$(printf '%s' "$ANTHROPIC_API_KEY_B64" | base64 -d)

          install -d -m 700 /opt/cap
          if [ ! -d /opt/cap/.git ]; then
            git clone --depth=1 "$REPOSITORY_URL" /opt/cap
          else
            git -C /opt/cap fetch --depth=1 origin main
            git -C /opt/cap checkout -B main origin/main
          fi

          STORAGE_ENDPOINT="$R2_S3_ENDPOINT"
          STORAGE_BUCKET=cap-media
          STORAGE_REGION=auto
          STORAGE_ACCESS_KEY="$R2_ACCESS_KEY_ID"
          STORAGE_SECRET_KEY="$R2_SECRET_ACCESS_KEY"

          if [ "$MIGRATE_TO_BEGET" = "true" ]; then
            test -n "$BEGET_S3_ACCESS_KEY_ID"
            test -n "$BEGET_S3_SECRET_ACCESS_KEY"
            BEGET_S3_ENDPOINT=https://s3.ru1.storage.beget.cloud
            BEGET_S3_BUCKET=d5e16f195c6b-cap

            cat > /tmp/cap-beget-cors.json <<'CORS'
          {
            "CORSRules": [
              {
                "AllowedOrigins": ["https://cap.mayorov.team"],
                "AllowedMethods": ["GET", "PUT", "HEAD", "POST", "DELETE"],
                "AllowedHeaders": ["*"],
                "ExposeHeaders": ["ETag", "Content-Length", "Content-Range"],
                "MaxAgeSeconds": 3600
              }
            ]
          }
          CORS

            docker run --rm \
              -e AWS_ACCESS_KEY_ID="$BEGET_S3_ACCESS_KEY_ID" \
              -e AWS_SECRET_ACCESS_KEY="$BEGET_S3_SECRET_ACCESS_KEY" \
              -e AWS_DEFAULT_REGION=ru1 \
              -e AWS_PAGER= \
              -v /tmp/cap-beget-cors.json:/tmp/cors.json:ro \
              amazon/aws-cli:2.27.42 s3api put-bucket-cors \
              --bucket "$BEGET_S3_BUCKET" \
              --endpoint-url "$BEGET_S3_ENDPOINT" \
              --cors-configuration file:///tmp/cors.json

            RCLONE_CONFIG=/tmp/cap-rclone.conf
            umask 077
            cat > "$RCLONE_CONFIG" <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = $R2_ACCESS_KEY_ID
          secret_access_key = $R2_SECRET_ACCESS_KEY
          endpoint = $R2_S3_ENDPOINT
          no_check_bucket = true

          [beget]
          type = s3
          provider = Other
          access_key_id = $BEGET_S3_ACCESS_KEY_ID
          secret_access_key = $BEGET_S3_SECRET_ACCESS_KEY
          endpoint = $BEGET_S3_ENDPOINT
          region = ru1
          force_path_style = true
          no_check_bucket = true
          EOF

            docker run --rm \
              -v "$RCLONE_CONFIG:/config/rclone/rclone.conf:ro" \
              rclone/rclone:latest copy \
              r2:cap-media beget:"$BEGET_S3_BUCKET" \
              --stats-one-line --stats 10s

            docker run --rm \
              -v "$RCLONE_CONFIG:/config/rclone/rclone.conf:ro" \
              rclone/rclone:latest check \
              r2:cap-media beget:"$BEGET_S3_BUCKET" \
              --one-way --size-only

            rm -f "$RCLONE_CONFIG" /tmp/cap-beget-cors.json
            STORAGE_ENDPOINT="$BEGET_S3_ENDPOINT"
            STORAGE_BUCKET="$BEGET_S3_BUCKET"
            STORAGE_REGION=ru1
            STORAGE_ACCESS_KEY="$BEGET_S3_ACCESS_KEY_ID"
            STORAGE_SECRET_KEY="$BEGET_S3_SECRET_ACCESS_KEY"
          fi

          umask 077
          if [ ! -f /opt/cap/.env.generated ]; then
            cat > /opt/cap/.env.generated <<EOF
          MYSQL_PASSWORD=$(openssl rand -hex 32)
          MYSQL_ROOT_PASSWORD=$(openssl rand -hex 32)
          DATABASE_ENCRYPTION_KEY=$(openssl rand -hex 32)
          NEXTAUTH_SECRET=$(openssl rand -hex 32)
          MEDIA_SERVER_WEBHOOK_SECRET=$(openssl rand -hex 32)
          EOF
          fi

          cat /opt/cap/.env.generated > /opt/cap/.env
          cat >> /opt/cap/.env <<EOF
          CAP_URL=https://cap.mayorov.team
          S3_PUBLIC_ENDPOINT=$STORAGE_ENDPOINT
          S3_INTERNAL_ENDPOINT=$STORAGE_ENDPOINT
          CAP_AWS_ACCESS_KEY=$STORAGE_ACCESS_KEY
          CAP_AWS_SECRET_KEY=$STORAGE_SECRET_KEY
          CAP_AWS_BUCKET=$STORAGE_BUCKET
          CAP_AWS_REGION=$STORAGE_REGION
          S3_PATH_STYLE=true
          CAP_VIDEOS_DEFAULT_PUBLIC=true
          RESEND_API_KEY=
          RESEND_FROM_DOMAIN=
          EOF

          if [ -n "$ASSEMBLY_API_KEY" ]; then printf 'ASSEMBLY_API_KEY=%s\n' "$ASSEMBLY_API_KEY" >> /opt/cap/.env; fi
          if [ -n "$GROQ_API_KEY" ]; then printf 'GROQ_API_KEY=%s\n' "$GROQ_API_KEY" >> /opt/cap/.env; fi
          if [ -n "$OPENAI_API_KEY" ]; then printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY" >> /opt/cap/.env; fi
          if [ -n "$ANTHROPIC_API_KEY" ]; then printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY" >> /opt/cap/.env; fi
          if [ -n "$AI_API_KEY" ]; then
            printf 'AI_API_KEY=%s\n' "$AI_API_KEY" >> /opt/cap/.env
            printf 'AI_BASE_URL=%s\n' "${AI_BASE_URL:-https://api.hydraai.ru/v1}" >> /opt/cap/.env
            printf 'AI_MODEL=%s\n' "${AI_MODEL:-hydra-gpt}" >> /opt/cap/.env
            printf 'AI_PROVIDER=%s\n' "${AI_PROVIDER:-openai-compatible}" >> /opt/cap/.env
          elif [ -n "$AI_PROVIDER" ]; then
            printf 'AI_PROVIDER=%s\n' "$AI_PROVIDER" >> /opt/cap/.env
            if [ -n "$AI_BASE_URL" ]; then printf 'AI_BASE_URL=%s\n' "$AI_BASE_URL" >> /opt/cap/.env; fi
            if [ -n "$AI_MODEL" ]; then printf 'AI_MODEL=%s\n' "$AI_MODEL" >> /opt/cap/.env; fi
          elif [ -n "$ASSEMBLY_API_KEY" ] && [ -z "$GROQ_API_KEY" ] && [ -z "$OPENAI_API_KEY" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            printf 'AI_PROVIDER=assemblyai\n' >> /opt/cap/.env
          fi

          docker compose -f /opt/cap/docker-compose.r2.yml pull
          docker compose -f /opt/cap/docker-compose.r2.yml up -d
          docker compose -f /opt/cap/docker-compose.r2.yml ps

          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 10 https://cap.mayorov.team/ >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f /opt/cap/docker-compose.r2.yml ps
          exit 1
          REMOTE
